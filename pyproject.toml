[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deskforge"
version = "2.0.0"
description = "Universal Linux desktop application integrator and launcher manager (AppImage, JAR, binaries, scripts, and Web Apps)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agustin" }]
keywords = ["linux", "desktop", "launcher", "appimage", "jar", "freedesktop", "xdg", "gear-lever"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "ttkbootstrap>=1.10.0",
    "pillow>=10.0.0",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.4.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
deskforge = "deskforge.cli.main:main"
deskforge-gui = "deskforge.ui.app:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deskforge = ["assets/*.png", "assets/*.svg"]
